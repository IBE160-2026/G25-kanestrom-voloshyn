[project]
name = "ai-study-buddy-backend"
version = "0.1.0"
description = "AI Study Buddy backend: async FastAPI API that also serves the built SPA"
authors = [
    { name = "Ihvol100", email = "ihor.voloshyn@himolde.no" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1",
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "markitdown[docx,pptx]==0.1.9",
    "pdfplumber>=0.11,<0.12",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.20",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
